name: Documentation integrity
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate documentation and reference fixtures
        run: python3 scripts/check-docs.py
      - name: Validate current edition, inventories and preserved history
        run: python3 scripts/check-current-docs.py
      - name: Require accompanying documentation for application changes
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$DOCS_DIFF_BASE" ] && [ "$DOCS_DIFF_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check-docs.py --diff-base "$DOCS_DIFF_BASE"
          fi
