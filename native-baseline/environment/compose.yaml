services:
  database:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: sandbox_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local secret}
      POSTGRES_DB: sandbox_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["sandbox_db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_dev -d sandbox_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
volumes:
  sandbox_db:
