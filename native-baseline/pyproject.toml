[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires a running disposable database", "native: requires native PostgreSQL concurrency"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["tests/reference", "database/migrate.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
